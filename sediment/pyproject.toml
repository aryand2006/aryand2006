[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sediment"
version = "0.1.0"
description = "Deterministic structural-erosion gate for machine-authored code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Daga", email = "aryand@andrew.cmu.edu" }]
keywords = ["static-analysis", "code-quality", "ci", "ai-generated-code", "technical-debt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies, by design: a gate that is slow or awkward to install
# is a gate that never gets turned on.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sediment = "sediment.cli:main"

[project.urls]
Source = "https://github.com/aryand2006/sediment"

[tool.setuptools.packages.find]
include = ["sediment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
