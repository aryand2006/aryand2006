# Runs the erosion gate on every pull request and posts the result as a comment.
# The gate needs both sides of the change, so the checkout must not be shallow.

name: sediment

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  erosion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sediment
        run: pip install --quiet sediment

      - name: Gate the change
        id: gate
        run: |
          sediment gate \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --markdown > report.md
        continue-on-error: true

      - name: Comment the report
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            // Update the existing report in place rather than stacking comments.
            const previous = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith('### sediment')
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Enforce
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::change exceeds the allowed erosion rate"
          exit 1
